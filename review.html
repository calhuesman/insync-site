.btn.on { background: var(--navy); }
dialog { width: min(640px, 100%); max-height: 100%; margin: auto 0 0; padding: 0; border: 0; border-radius: 24px 24px 0 0; background: var(--cream); color: var(--navy); }

.sheet { max-height: 92vh; overflow-y: auto; }

f","long-grain white rice","green onions, thinly sliced","hot sauce"],"e":"🍲","c":"#F5E1CF","n":1,"v":""},{"i":"red-beans-and-rice","t":"Red Beans and Rice","m":["dinner"],"s":"Creamy, slow-simmered red kidney beans with smoky andouille and the holy trinity, spooned over fluffy white rice.","g":["dried red kidney beans, picked over and rinsed","smoked andouille sausage, sliced into 1/4-inch coins","vegetable oil","yellow onion, diced","green bell pepper, diced","celery, diced","garlic, minced","Cajun seasoning","dried thyme","bay leaf","water, plus more for soaking","long-grain white rice","green onions, thinly sliced","hot sauce"],"e":"🫘","c":"#F9DCD6","n":1,"v":""},{"i":"american-goulash","t":"American Goulash","m":["dinner"],"s":"Elbow macaroni, savory ground beef and a rich tomato sauce cooked together in one pot and topped with melty cheddar.","g":["ground beef (85/15)","olive oil","yellow onion, diced","garlic, minced","diced tomatoes, with their juice","tomato sauce","low-sodium beef broth","Italian seasoning","paprika","bay leaf","salt","black pepper","elbow macaroni","shredded cheddar"],"e":"🍝","c":"#FFE1D6","n":1,"v":""},{"i":"classic-cheese-pizza","t":"Classic Cheese Pizza","m":["lunch","dinner"],"s":"A crisp, chewy homemade pizza with a garlicky tomato sauce and bubbling, golden mozzarella.","g":["store-bought or homemade pizza dough","olive oil, divided","all-purpose flour, for dusting","canned crushed tomatoes","garlic, minced","dried oregano","salt","low-moisture mozzarella, shredded","fresh basil, torn","red pepper flakes, optional"],"e":"🍕","c":"#FFE8C7","n":1,"v":""},{"i":"slow-cooker-pulled-pork","t":"Slow Cooker Pulled Pork Sandwiches","m":["dinner"],"s":"Spice-rubbed pork shoulder cooked low and slow until it falls apart, tossed in smoky BBQ sauce and piled on soft buns with creamy coleslaw.","g":["boneless pork shoulder (pork butt), trimmed of thick fat","brown sugar","smoked paprika","garlic powder","onion powder","salt","black pepper","yellow onion, sliced","apple cider vinegar, plus 1 tbsp for the slaw","water","BBQ sauce","coleslaw mix (shredded cabbage and carrot)","mayonnaise","sugar","soft hamburger buns"],"e":"🥪","c":"#F7DCCB","n":1,"v":""}];
const IMG = 'https://djljecikuqcyvszgvein.supabase.co/storage/v1/object/public/recipe-images/';
const KEY = 'insync-review-flags';
let flags = {};
try { flags = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { flags = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(flags)); } catch (e) {} };
let filter = 'all', query = '', open = null;
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const meals = r => r.m.join(' · ');
// Photo over the emoji tile; if the photo fails, the emoji stays.
const art = (r, full) => `<img src="${IMG}${full ? '' : 'thumbs/'}${r.i}.webp${r.v ? '?' + r.v : ''}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`;

function matches(r) {
  if (filter === 'new' && !r.n) return false;
  if (filter === 'flagged' && !(r.i in flags)) return false;
  if (['breakfast', 'lunch', 'dinner'].includes(filter) && !r.m.includes(filter)) return false;
  if (!query) return true;
  const hay = (r.t + ' ' + r.i + ' ' + r.g.join(' ')).toLowerCase();
  return query.split(/\s+/).every(w => hay.includes(w));
}

function render() {
  const list = R.filter(matches);
  $('grid').innerHTML = list.map(r => `<button class="card-r" data-i="${r.i}" aria-label="${esc(r.t)}${r.n ? ', new' : ''}${r.i in flags ? ', flagged' : ''}">
<div class="art" style="background:${esc(r.c)}">${esc(r.e)}${art(r)}${r.n ? '<span class="tag">New</span>' : ''}${r.i in flags ? '<span class="flagged" aria-hidden="true">🚩</span>' : ''}</div>
<div class="meta"><b>${esc(r.t)}</b><small>${meals(r)}</small></div></button>`).join('');
  $('empty').hidden = list.length > 0;
  $('count').textContent = `${list.length} of ${R.length}`;
  const n = Object.keys(flags).length;
  $('copy').textContent = n ? `Copy my flags (${n})` : 'Copy my flags';
}

function showFlag(r) {
  const on = r.i in flags;
  $('df').textContent = on ? '🚩 Flagged · tap to unflag' : 'Flag this photo';
  $('df').classList.toggle('on', on);
  $('df').classList.toggle('ghost', !on);
  $('dn').hidden = !on;
  $('dn').value = on ? flags[r.i] : '';
}

function openCard(id) {
  const r = R.find(x => x.i === id); if (!r) return;
  open = r;
  $('dh').style.background = r.c;
  $('dh').innerHTML = `${esc(r.e)}${art(r, true)}<button class="close" id="dx" aria-label="Close">✕</button>`;
  $('dx').onclick = () => $('dlg').close();
  $('dt').textContent = r.t;
  $('di').textContent = r.i;
  $('dm').textContent = `${meals(r)}${r.n ? ' · new' : ''} · save as ${r.i}.png`;
  $('ds').textContent = r.s;
  $('dg').innerHTML = r.g.map(g => `<li>${esc(g)}</li>`).join('');
  showFlag(r);
  $('dlg').showModal();
  $('dlg').querySelector('.sheet').scrollTop = 0;
}

$('grid').addEventListener('click', e => { const b = e.target.closest('.card-r'); if (b) openCard(b.dataset.i); });
$('dlg').addEventListener('click', e => { if (e.target === $('dlg')) $('dlg').close(); });
$('dlg').addEventListener('close', () => { open = null; render(); });
$('df').addEventListener('click', () => {
  if (!open) return;
  if (open.i in flags) delete flags[open.i]; else flags[open.i] = '';
  save(); showFlag(open);
  if (open.i in flags) $('dn').focus();
});
$('dn').addEventListener('input', () => { if (open && open.i in flags) { flags[open.i] = $('dn').value; save(); } });
$('q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); render(); });
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  filter = c.dataset.f;
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === c));
  render();
}));

// Pantry basics left out of "key ingredients" (they don't show in a photo).
const BASIC = /^(kosher |flaky |sea |fine )?salt\b|black pepper|^pepper\b|salt and (black )?pepper|\b(olive|vegetable|neutral|canola|avocado|cooking) oil\b|^oil\b|^water\b|cooking spray|^ice\b/i;
function aiPrompt(r) {
  // Names only: "marinara sauce, divided" → "marinara sauce".
  const keys = [...new Set(r.g.map(g => g.split(',')[0].trim()).filter(g => g && !BASIC.test(g)))];
  return `Photo of homemade ${r.t}, one serving, plated. Key ingredients: ${keys.join(', ')}. `
    + `Only foods from this list, small herb garnish ok. `
    + `Square, overhead-ish 45° angle, rustic wood table, soft natural window light, realistic food photography.`;
}
async function copyText(text, msg) {
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch (e) { window.prompt('Copy this:', text); }
}
$('dp').addEventListener('click', () => { if (open) copyText(aiPrompt(open), 'Prompt copied'); });
$('dic').addEventListener('click', () => { if (open) copyText(open.i, `Copied ${open.i}`); });

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }
$('copy').addEventListener('click', async () => {
  const ids = R.map(r => r.i).filter(i => i in flags);
  if (!ids.length) { toast('No flags yet. Tap a photo, then Flag this photo.'); return; }
  const text = ids.map(i => `${i}: ${(flags[i] || '').trim() || '(no note)'}`).join('\n');
  try { await navigator.clipboard.writeText(text); toast(`Copied ${ids.length} flag${ids.length === 1 ? '' : 's'}`); }
  catch (e) { window.prompt('Copy your flags:', text); }
});
render();
</script>
